<!doctype html><html><head><meta charset="UTF-8"><style>html,body,#game{margin:0;width:100%;height:100%;background:#0d1524;overflow:hidden}#hud{position:fixed;top:10px;left:10px;color:white;font:14px monospace;pointer-events:none;background:#0008;padding:8px;white-space:pre-line}</style></head><body><div id="game"></div><div id="hud"></div><script src="/engine.js"></script><script>window.game=new Flight.CabinEngine(document.querySelector('#game'),s=>{window.flight=s;document.querySelector('#hud').textContent=`${s.stage} ${s.phase} ${s.prompt}\n${s.altitude.toFixed(0)}m ${s.speed.toFixed(0)}kt ${s.announcement}\n${s.served}/${s.requiredServed} coffee ${s.belts}/${s.requiredBelts} belts`});</script></body></html>
