<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cabin Crisis · 同机位画面对比</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111820;color:#ecf1f4;font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1400px;padding:48px 24px;margin:auto}header{display:flex;align-items:end;justify-content:space-between;gap:32px;margin-bottom:30px}h1{font-size:clamp(27px,4vw,44px);line-height:1.2;letter-spacing:-.03em;margin:8px 0}p{color:#a9bac7;max-width:780px}.eyebrow{color:#edc168;font-size:12px;letter-spacing:.12em}a{color:#8cd4f1}button,select{font:inherit;color:#ecf1f4;background:#22333e;border:1px solid #3a505f;padding:10px 14px;border-radius:5px}.compare{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:10px;background:#090e12;--split:50%;border:1px solid #354550}.compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.before{clip-path:inset(0 calc(100% - var(--split)) 0 0)}.divider{position:absolute;top:0;bottom:0;left:var(--split);width:2px;background:white;box-shadow:0 0 8px #000}.divider:after{content:'↔';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#f5f4ed;color:#152837;padding:5px 10px;border-radius:30px}.tag{position:absolute;top:18px;padding:6px 13px;border-radius:4px;background:#101c28c9;font-size:12px;letter-spacing:.06em}.old{left:18px}.new{right:18px}.range{width:100%;accent-color:#edc168;margin:20px 0 10px}label{display:block;color:#a9bac7;font-size:13px}.controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:22px 0}footer{border-top:1px solid #2c3c47;margin-top:36px;padding-top:24px;color:#a9bac7;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:30px}.grid img{width:100%;border-radius:5px}.grid figure{margin:0}.grid figcaption{font-size:12px;color:#a9bac7;padding-top:5px}@media(max-width:700px){main{padding:25px 14px}header{display:block}.grid{grid-template-columns:1fr 1fr}.tag{top:8px;font-size:10px;padding:3px 6px}.old{left:8px}.new{right:8px}}
</style><main><header><div><span class="eyebrow">CABIN CRISIS / VISUAL REVIEW</span><h1>同一个机位，看真实变化。</h1><p>两侧都是真实 3D 引擎画面。使用相同相机位置、视线、分辨率和航班条件；画面没有后期修图。滑动分界线，比较上线前的 V2 与本次 V3。</p></div><a href="https://dearpassengers.net/play/cabin-crisis/?version=3">进入游戏 ↗</a></header>
<div class="controls"><label for="scene">对比场景</label><select id="scene"><option value="day-aisle">白天客舱</option><option value="passenger-coffee">人物与咖啡</option><option value="meal-service">餐食服务</option><option value="cockpit">驾驶舱</option><option value="storm-fire">暴风与火警</option><option value="night-cabin">夜间客舱</option></select><span id="caption"></span></div>
<div class="compare" id="compare"><img id="after" src="evidence/v3/day-aisle.png" alt="V3 客舱"><img id="before" class="before" src="evidence/v2/day-aisle.png" alt="V2 客舱"><div class="divider"></div><span class="tag old">V2 · 修改前</span><span class="tag new">V3 · 修改后</span></div><input id="split" class="range" type="range" min="0" max="100" value="50" aria-label="拖动比较修改前后的画面"><label for="split">左侧 V2 / 右侧 V3。键盘左右方向键也可调整。</label>
<div class="grid"><figure><img src="evidence/v3/passenger-coffee.png" alt="V3 角色与咖啡" loading="lazy"><figcaption>人物轮廓、凸眼与服装</figcaption></figure><figure><img src="evidence/v3/cockpit.png" alt="V3 驾驶台" loading="lazy"><figcaption>驾驶仪表与第一人称双手</figcaption></figure><figure><img src="evidence/v3/storm-fire.png" alt="V3 暴风火警" loading="lazy"><figcaption>天气、火焰与空间光照</figcaption></figure></div>
<footer>拍摄条件：1600 × 900，DPR 1，独立本地 QA 场景。这里比较的是本项目的两个版本，不是证明与官方原作完全一致。美术参考来自 <a href="https://store.steampowered.com/app/4534960/Dear_Passengers/">官方商店截图</a> 和 <a href="https://www.youtube.com/watch?v=XRvd_HZesys">官方宣传片</a>。原作参考素材未作为游戏画面覆盖层使用。</footer></main><script>const select=document.querySelector('#scene'),split=document.querySelector('#split'),compare=document.querySelector('#compare');select.addEventListener('change',()=>{document.querySelector('#before').src=`evidence/v2/${select.value}.png`;document.querySelector('#after').src=`evidence/v3/${select.value}.png`;});split.addEventListener('input',()=>compare.style.setProperty('--split',split.value+'%'));</script></html>
